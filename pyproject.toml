[project]
name = "ppa-pipeline"
version = "0.1.0"
description = "Actualización Código de ETL Comercial CEN, nuevas practicas de Ingeniero de Datos"
readme = "README.md"
authors = [
    { name = "kashibeokok-art", email = "kashibeokok@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[project.scripts]
ppa-pipeline = "ppa_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["OLD"]

[tool.ruff.lint]
select = [
    "E", "F",   # errores básicos y de Python
    "I",        # TODO: busca en la documentación qué hace la regla "I"
    "B",        # TODO: y "B"
    "UP",       # modernizar sintaxis a la versión de Python
    "PD",       # TODO: esta es específica para ingeniería de datos, ¿de qué librería?
]
[tool.ruff.format]
exclude = ["*.md"]   # no reformatear los bloques de código de la documentación (comentarios alineados a propósito)

[tool.ruff.lint.isort]
known-first-party = ["ppa_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
